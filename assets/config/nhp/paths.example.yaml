# Copy to paths.local.yaml and fill in absolute paths for this machine.
paths:
  dataset_root: null
  cache_root: null
  artifact_root: null
  log_root: null
runtime:
  shared_fit_wait_timeout_seconds: 7200
  shared_fit_poll_interval_seconds: 120
  python: null  # Optional: otherwise use the launcher's interpreter.
  device: auto  # Most free GPU memory; also accepts cpu or GPU index/UUID.
  cpu_threads: 4
  cpu_interop_threads: 1
  log_level: INFO
  figure_regeneration: incomplete  # Use all after changing figure styles.
  preview_regeneration: incomplete
  tensorboard: false
