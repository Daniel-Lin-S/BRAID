extends: style.yaml
enabled: true
metrics: [cc, r2, mse]
curves:
- name: neural_population
  parameter: population_scale
  where:
    target: neural
    metric: cc
    horizon: 4
    evaluation_set: common
    nx:
    - 16
    - 64
  group: nx
- name: behavior_population
  parameter: population_scale
  where:
    target: behavior
    metric: cc
    horizon: 4
    evaluation_set: common
    nx:
    - 16
    - 64
  group: nx
