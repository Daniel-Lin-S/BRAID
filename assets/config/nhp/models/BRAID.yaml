model:
  dimensions:
    behaviour_relevant_neural_state_size: 16
    behaviour_irrelevant_neural_state_size: 0
    non_neural_behaviour_state_size: null
    preprocessing_state_size: 150
  allow_stage_2_behaviour_contribution: false
  include_direct_neural_to_behaviour_mapping: false
  include_input_feedthrough: false
  include_input_in_decoders: false
  neural_decoder_uses_full_state: false
  behaviour_decoder_uses_full_state: false
  skip_neural_decoder: false
  stage_1:
    combine_state_and_input_mapping: false
    state_transition:
      architecture: multilayer_perceptron
      hidden_size: none
      depth: none
      activation: linear
      output_activation: linear
      use_bias: false
      dropout_rate: 0.0
      kernel_initialiser: uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
    input_mapping:
      hidden_size: none
      depth: none
      activation: linear
      output_activation: linear
      use_bias: false
      dropout_rate: 0.0
      kernel_initialiser: uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
    neural_decoder:
      hidden_size: 64
      depth: 1
      activation: relu
      output_activation: linear
      use_bias: true
      dropout_rate: 0.0
      kernel_initialiser: glorot_uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
    behaviour_decoder:
      hidden_size: 64
      depth: 1
      activation: relu
      output_activation: linear
      use_bias: true
      dropout_rate: 0.0
      kernel_initialiser: uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
  stage_2:
    combine_state_and_input_mapping: false
    state_transition:
      architecture: multilayer_perceptron
      hidden_size: none
      depth: none
      activation: linear
      output_activation: linear
      use_bias: false
      dropout_rate: 0.0
      kernel_initialiser: uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
    input_mapping:
      hidden_size: none
      depth: none
      activation: linear
      output_activation: linear
      use_bias: false
      dropout_rate: 0.0
      kernel_initialiser: uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
    neural_decoder:
      hidden_size: 64
      depth: 1
      activation: relu
      output_activation: linear
      use_bias: true
      dropout_rate: 0.0
      kernel_initialiser: uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
    behaviour_decoder:
      hidden_size: 64
      depth: 1
      activation: relu
      output_activation: linear
      use_bias: true
      dropout_rate: 0.0
      kernel_initialiser: glorot_uniform
      bias_initialiser: zeros
      kernel_regulariser: none
      kernel_regulariser_arguments: none
      bias_regulariser: none
      bias_regulariser_arguments: none
training:
  maximum_epochs: 2500
  # Maximum; effective size follows available windows in each session/fold.
  training_batch_size: 32
  initialisation_attempts: 1
  maximum_refit_attempts: 1
  early_stopping_patience: 10
  early_stopping_measure: val_loss
  recurrent_early_stopping_start_epoch: 0
  decoder_early_stopping_start_epoch: 0
  create_validation_from_training: false
  validation_set_ratio: 0.2
  optimiser: Adam
  optimiser_arguments:
    learning_rate: 0.001
  learning_rate_schedule: none
  learning_rate_schedule_arguments: none
  trainable_components: none
  clear_tensorflow_graph: true
  verbose: true
  save_training_logs: true
  skip_prediction_calculation: false
  honor_explicit_validation: true
  restore_best_weights: true
  independent_windows: true
  sequence_length: 128
  epoch_artifacts: true
forecast:
  enable_forward_prediction: true
  steps_ahead:
  - 1
  - 2
  - 4
  - 8
  steps_ahead_loss_weights:
  - 1
  - 1
  - 1
  - 1
  use_observed_input_in_dynamics: false
  use_observed_input_in_decoder: false
preprocessing:
  remove_flat_dimensions: true
  standardise_inputs: true
  standardise_each_dimension: false
  reuse_existing_models: false
